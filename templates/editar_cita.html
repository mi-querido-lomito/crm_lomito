{% extends "base.html" %}
{% block content %}

<h2>Editar Cita</h2>

<form method="POST">

    <label>Fecha y Hora:</label>
    <input type="datetime-local"
           name="fecha"
           value="{{ fecha_html }}"
           class="form-control mb-2"
           required>

    <label>Estado:</label>
    <select name="estado" class="form-control mb-3">

        <option value="pendiente"
        {% if cita.estado == "pendiente" %}selected{% endif %}>
        Pendiente
        </option>

        <option value="completada"
        {% if cita.estado == "completada" %}selected{% endif %}>
        Completada
        </option>

        <option value="perdida"
        {% if cita.estado == "perdida" %}selected{% endif %}>
        Perdida
        </option>

        <option value="cancelada"
        {% if cita.estado == "cancelada" %}selected{% endif %}>
        Cancelada
        </option>

    </select>

    <button class="btn btn-success w-100">
        Guardar Cambios
    </button>

</form>

{% endblock %}
