{% extends "base.html" %}
{% block content %}

<h2>Editar Cita</h2>

<form method="POST">

    <label>Fecha y Hora:</label>
    <input type="datetime-local"
           name="fecha"
           value="{{ fecha_html }}"
           class="form-control mb-2"
           required>

    <label>Servicio:</label>
    <select name="servicio_id" class="form-control mb-2">
        <option value="">Sin servicio</option>
        {% for s in servicios %}
        <option value="{{ s.id }}" {% if s.id == cita.servicio_id %}selected{% endif %}>
            {{ s.nombre }} - ${{ s.precio }}
        </option>
        {% endfor %}
    </select>

    <label>Estado:</label>
    <select name="estado" class="form-control mb-2">
        <option value="Pendiente" {% if cita.estado == "Pendiente" %}selected{% endif %}>Pendiente</option>
        <option value="Completada" {% if cita.estado == "Completada" %}selected{% endif %}>Completada</option>
        <option value="Cancelada" {% if cita.estado == "Cancelada" %}selected{% endif %}>Cancelada</option>
    </select>

    <label>Tiempo transcurrido en servicio:</label>
    <input type="number"
           name="tiempo_servicio_min"
           value="{{ cita.tiempo_servicio_min or '' }}"
           class="form-control mb-2"
           placeholder="Minutos">

    <label>Notas de agenda:</label>
    <textarea name="notas" class="form-control mb-2">{{ cita.notas or "" }}</textarea>

    <label>Observaciones del servicio:</label>
    <textarea name="observaciones" class="form-control mb-3">{{ cita.observaciones or "" }}</textarea>

    <button class="btn btn-success w-100">
        Guardar Cambios
    </button>

</form>

{% endblock %}
