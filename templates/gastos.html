{% extends "base.html" %}
{% block content %}

<h2>Gastos Fijos</h2>

<form method="POST" class="mb-3">

<input name="concepto" placeholder="Concepto" class="form-control mb-2" required>
<input type="number" step="0.01" name="monto" placeholder="Monto" class="form-control mb-2" required>
<input type="date" name="fecha" class="form-control mb-2" required>
<select name="metodo_pago" class="form-select mb-2" required>
    <option value="" selected disabled>Medio de pago</option>
    <option value="Efectivo">Efectivo</option>
    <option value="Tarjeta">Tarjeta</option>
    <option value="Transferencia">Transferencia</option>
</select>
<textarea name="descripcion" placeholder="Descripción" class="form-control mb-2"></textarea>

<button class="btn btn-danger">Registrar Gasto</button>

</form>

<table class="table table-striped">
<thead class="thead-gastos">
<tr>
<th>Concepto</th>
<th>Monto</th>
<th>Fecha</th>
<th>Medio de pago</th>
</tr>
</thead>
<tbody>
{% for g in gastos %}
<tr>
<td data-label="Concepto">{{ g.concepto }}</td>
<td data-label="Monto">${{ g.monto }}</td>
<td data-label="Fecha">{{ g.fecha }}</td>
<td data-label="Medio de pago">{{ g.metodo_pago or 'Sin especificar (registro anterior)' }}</td>
</tr>
{% endfor %}
</tbody>
</table>

{% endblock %}
