{% extends "base.html" %}
{% block content %}

<h2>Editar Insumo</h2>

<form method="POST">

    <input name="nombre"
           value="{{ insumo.nombre }}"
           class="form-control mb-2"
           placeholder="Nombre"
           required>

    <input type="number"
           name="stock"
           value="{{ insumo.stock }}"
           class="form-control mb-2"
           placeholder="Stock"
           required>

    <input type="number"
           step="0.01"
           name="costo"
           value="{{ insumo.costo }}"
           class="form-control mb-2"
           placeholder="Costo"
           required>

    <select name="proveedor_id" class="form-control mb-2">
        <option value="">Sin proveedor</option>
        {% for proveedor in proveedores %}
        <option value="{{ proveedor.id }}"
                {% if insumo.proveedor_id == proveedor.id %}selected{% endif %}>
            {{ proveedor.nombre }}
        </option>
        {% endfor %}
    </select>

    <input value="{{ insumo.codigo_barras or 'Se generará al guardar' }}"
           class="form-control mb-3"
           readonly>

    <button class="btn btn-success w-100">
        Guardar Cambios
    </button>

</form>

{% endblock %}
