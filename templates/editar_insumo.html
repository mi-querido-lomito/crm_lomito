{% extends "base.html" %}
{% block content %}

<h2>Editar Insumo</h2>

<style>
.insumo-foto-preview {
    width: 160px;
    height: 160px;
    object-fit: cover;
    border: 1px solid #dee2e6;
    border-radius: 6px;
    background: #f8f9fa;
}
</style>

<form method="POST" enctype="multipart/form-data">

    <input name="nombre"
           value="{{ insumo.nombre }}"
           class="form-control mb-2"
           placeholder="Nombre"
           required>

    <input type="number"
           name="stock"
           value="{{ insumo.stock }}"
           class="form-control mb-2"
           placeholder="Stock"
           required>

    <input type="number"
           step="0.01"
           name="costo"
           value="{{ insumo.costo }}"
           class="form-control mb-2"
           placeholder="Costo"
           required>

    <select name="proveedor_id" class="form-control mb-2">
        <option value="">Sin proveedor</option>
        {% for proveedor in proveedores %}
        <option value="{{ proveedor.id }}"
                {% if insumo.proveedor_id == proveedor.id %}selected{% endif %}>
            {{ proveedor.nombre }}
        </option>
        {% endfor %}
    </select>

    <label>Foto:</label>
    {% if insumo.foto_drive_id %}
    <div class="mb-2">
        <img src="{{ url_for('foto_insumo', id=insumo.id, v=insumo.foto_actualizada) }}"
             alt="Foto de {{ insumo.nombre }}"
             loading="lazy"
             class="insumo-foto-preview">
    </div>
    <div class="d-flex flex-wrap gap-2 mb-2">
        {% if insumo.foto_drive_web_view_url %}
        <a href="{{ insumo.foto_drive_web_view_url }}"
           class="btn btn-outline-secondary btn-sm"
           target="_blank"
           rel="noopener">
            Abrir en Drive
        </a>
        {% endif %}
        <div class="form-check align-self-center">
            <input class="form-check-input" type="checkbox" value="1" id="quitarFoto" name="quitar_foto">
            <label class="form-check-label" for="quitarFoto">Quitar foto actual</label>
        </div>
    </div>
    {% endif %}
    <input type="file"
           name="foto"
           accept="image/jpeg,image/png,image/gif,image/webp"
           class="form-control mb-2">

    <input value="{{ insumo.codigo_barras or 'Se generará al guardar' }}"
           class="form-control mb-3"
           readonly>

    <button class="btn btn-success w-100">
        Guardar Cambios
    </button>

</form>

{% endblock %}
