{% extends "base.html" %}
{% block content %}

<h2>Editar Mascota</h2>

<style>
.mascota-foto-preview {
    width: 160px;
    height: 160px;
    object-fit: cover;
    border: 1px solid #dee2e6;
    border-radius: 6px;
    background: #f8f9fa;
}
</style>

<form method="POST" enctype="multipart/form-data">
    <label>Nombre:</label>
    <input name="nombre"
           value="{{ mascota.nombre }}"
           class="form-control mb-2"
           required>

    <label>Especie:</label>
    <select name="especie" class="form-control mb-2">
        <option value="Perro" {% if mascota.especie == "Perro" %}selected{% endif %}>Perro</option>
        <option value="Gato" {% if mascota.especie == "Gato" %}selected{% endif %}>Gato</option>
    </select>

    <label>Dueño:</label>
    <select name="cliente_id" class="form-control mb-2" required>
        {% for c in clientes %}
        <option value="{{ c.id }}" {% if c.id == mascota.cliente_id %}selected{% endif %}>
            {{ c.nombre }}
        </option>
        {% endfor %}
    </select>

    <label>Foto:</label>
    {% if mascota.foto_drive_id %}
    <div class="mb-2">
        <img src="{{ url_for('foto_mascota', id=mascota.id, v=mascota.foto_actualizada) }}"
             alt="Foto de {{ mascota.nombre }}"
             loading="lazy"
             class="mascota-foto-preview">
    </div>
    <div class="d-flex flex-wrap gap-2 mb-2">
        {% if mascota.foto_drive_web_view_url %}
        <a href="{{ mascota.foto_drive_web_view_url }}"
           class="btn btn-outline-secondary btn-sm"
           target="_blank"
           rel="noopener">
            Abrir en Drive
        </a>
        {% endif %}
        <div class="form-check align-self-center">
            <input class="form-check-input" type="checkbox" value="1" id="quitarFoto" name="quitar_foto">
            <label class="form-check-label" for="quitarFoto">Quitar foto actual</label>
        </div>
    </div>
    {% endif %}
    <input type="file"
           name="foto"
           accept="image/jpeg,image/png,image/gif,image/webp"
           class="form-control mb-2">

    <label>Raza:</label>
    <input name="raza" value="{{ mascota.raza or '' }}" class="form-control mb-2">

    <label>Edad:</label>
    <input type="number" name="edad" value="{{ mascota.edad or '' }}" class="form-control mb-2">

    <label>Cumpleaños o fecha de adopción:</label>
    <input type="date" name="fecha_especial" value="{{ mascota.fecha_especial or '' }}" class="form-control mb-2">

    <label>Alergias:</label>
    <textarea name="alergias" class="form-control mb-2">{{ mascota.alergias or "" }}</textarea>

    <label>Género:</label>
    <select name="genero" class="form-control mb-2">
        <option value="">Sin especificar</option>
        <option value="Macho" {% if mascota.genero == "Macho" %}selected{% endif %}>Macho</option>
        <option value="Hembra" {% if mascota.genero == "Hembra" %}selected{% endif %}>Hembra</option>
    </select>

    <label>Talla:</label>
    <input name="talla" value="{{ mascota.talla or '' }}" class="form-control mb-2">

    <label>Color:</label>
    <input name="color" value="{{ mascota.color or '' }}" class="form-control mb-2">

    <label>Observaciones generales:</label>
    <textarea name="notas" class="form-control mb-3">{{ mascota.notas or "" }}</textarea>

    <button class="btn btn-success w-100">
        Guardar Cambios
    </button>
</form>

{% endblock %}
