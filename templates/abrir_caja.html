{% extends "base.html" %}
{% block content %}

<h2>Abrir Caja</h2>

{% if caja_requerida %}
<div class="alert alert-warning">
    Para comenzar a usar el sistema después de las 9:30 am, abre la caja del día.
</div>
{% endif %}

<form method="POST">
    <input type="number" step="0.01"
           name="monto_inicial"
           placeholder="Monto inicial"
           required
           class="form-control mb-2">

    <button class="btn btn-success w-100">
        Abrir Caja
    </button>
</form>

{% endblock %}
