{% extends "base.html" %}
{% block content %}

<h2>Abrir Caja</h2>

<form method="POST">
    <input type="number" step="0.01"
           name="monto_inicial"
           placeholder="Monto inicial"
           required
           class="form-control mb-2">

    <button class="btn btn-success w-100">
        Abrir Caja
    </button>
</form>

{% endblock %}
