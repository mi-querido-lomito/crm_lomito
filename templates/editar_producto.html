{% extends "base.html" %}
{% block content %}

<h2>Editar Producto</h2>

<form method="POST">

    <label>Nombre:</label>
    <input name="nombre"
           value="{{ producto.nombre }}"
           class="form-control mb-2"
           required>

    <label>Stock:</label>
    <input type="number"
           name="stock"
           value="{{ producto.stock }}"
           class="form-control mb-2"
           required>

    <label>Precio:</label>
    <input type="number"
           step="0.01"
           name="precio"
           value="{{ producto.precio }}"
           class="form-control mb-2"
           required>

    <label>Proveedor:</label>
    <select name="proveedor_id" class="form-control mb-2">
        <option value="">Sin proveedor</option>
        {% for proveedor in proveedores %}
        <option value="{{ proveedor.id }}"
                {% if producto.proveedor_id == proveedor.id %}selected{% endif %}>
            {{ proveedor.nombre }}
        </option>
        {% endfor %}
    </select>

    <label>Código de Barras:</label>
    <input value="{{ producto.codigo_barras or 'Se generará al guardar' }}"
           class="form-control mb-3"
           readonly>

    <button class="btn btn-success w-100">
        Guardar Cambios
    </button>

</form>

{% endblock %}
