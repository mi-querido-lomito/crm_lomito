{% extends "base.html" %}
{% block content %}

<h2>Editar Producto</h2>

<style>
.producto-foto-preview {
    width: 160px;
    height: 160px;
    object-fit: cover;
    border: 1px solid #dee2e6;
    border-radius: 6px;
    background: #f8f9fa;
}
</style>

<form method="POST" enctype="multipart/form-data">

    <label>Nombre:</label>
    <input name="nombre"
           value="{{ producto.nombre }}"
           class="form-control mb-2"
           required>

    <label>Stock:</label>
    <input type="number"
           name="stock"
           value="{{ producto.stock }}"
           class="form-control mb-2"
           required>

    <label>Precio:</label>
    <input type="number"
           step="0.01"
           name="precio"
           value="{{ producto.precio }}"
           class="form-control mb-2"
           required>

    <label>Proveedor:</label>
    <select name="proveedor_id" class="form-control mb-2">
        <option value="">Sin proveedor</option>
        {% for proveedor in proveedores %}
        <option value="{{ proveedor.id }}"
                {% if producto.proveedor_id == proveedor.id %}selected{% endif %}>
            {{ proveedor.nombre }}
        </option>
        {% endfor %}
    </select>

    <label>Foto:</label>
    {% if producto.foto_drive_id %}
    <div class="mb-2">
        <img src="{{ url_for('foto_producto', id=producto.id, v=producto.foto_actualizada) }}"
             alt="Foto de {{ producto.nombre }}"
             loading="lazy"
             class="producto-foto-preview">
    </div>
    <div class="d-flex flex-wrap gap-2 mb-2">
        {% if producto.foto_drive_web_view_url %}
        <a href="{{ producto.foto_drive_web_view_url }}"
           class="btn btn-outline-secondary btn-sm"
           target="_blank"
           rel="noopener">
            Abrir en Drive
        </a>
        {% endif %}
        <div class="form-check align-self-center">
            <input class="form-check-input" type="checkbox" value="1" id="quitarFoto" name="quitar_foto">
            <label class="form-check-label" for="quitarFoto">Quitar foto actual</label>
        </div>
    </div>
    {% endif %}
    <input type="file"
           name="foto"
           accept="image/jpeg,image/png,image/gif,image/webp"
           class="form-control mb-2">

    <label>Código de Barras:</label>
    <input value="{{ producto.codigo_barras or 'Se generará al guardar' }}"
           class="form-control mb-3"
           readonly>

    <button class="btn btn-success w-100">
        Guardar Cambios
    </button>

</form>

{% endblock %}
